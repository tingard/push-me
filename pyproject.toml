[project]
name = "push-me"
version = "0.1.0"
description = "A partially-observable, multi-object, multi-modal-goal variant of PushT"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Tim Lingard", email = "tklingard@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.5.1",
    "pygame-ce>=2.5.7",
    "pymunk>=7.3.0",
    "scipy>=1.18.0",
    "zarr>=3.3.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = ["src", "tests"]
